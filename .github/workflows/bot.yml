name: Clube do Mago - Bot de Ofertas

on:
  schedule:
    # Roda automaticamente a cada 1 hora (no minuto 0)
    - cron: '0 11-23,0-2 * * *'
  # Permite rodar manualmente clicando em um botão na aba Actions
  workflow_dispatch:

concurrency:
  group: clube-do-mago-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Restaurar banco de ofertas (evita duplicatas)
        uses: actions/cache/restore@v6
        with:
          path: data/offers.sqlite3
          key: offers-db-${{ github.run_id }}
          restore-keys: |
            offers-db-

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar bot de ofertas
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          AMAZON_ASSOCIATE_TAG: ${{ secrets.AMAZON_ASSOCIATE_TAG }}
          MIN_DISCOUNT_PERCENT: "15"
          ENABLE_AUTO_DISCOVERY: "true"
          DISCOVERY_MAX_ITEMS: "10"
          DISCOVERY_MIN_PRICE: "30"
          DISCOVERY_MAX_PRICE: "200"
          DISCOVERY_MIN_RATING: "4.3"
          DISCOVERY_MIN_REVIEWS: "50"
        run: python -m app.main --once

      - name: Salvar banco de ofertas atualizado
        if: always()
        uses: actions/cache/save@v6
        with:
          path: data/offers.sqlite3
          key: offers-db-${{ github.run_id }}