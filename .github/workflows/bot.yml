name: Clube do Mago - Bot de Ofertas

on:
  schedule:
    # Roda automaticamente a cada 1 hora (no minuto 0)
    - cron: '0 11-23,0-2 * * *'
  # Permite rodar manualmente clicando em um botão na aba Actions
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Restaurar banco de ofertas (evita duplicatas)
        uses: actions/cache/restore@v6
        with:
          path: data/offers.sqlite3
          key: offers-db-${{ github.run_id }}
          restore-keys: |
            offers-db-

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar bot de ofertas
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          AMAZON_ASSOCIATE_TAG: ${{ secrets.AMAZON_ASSOCIATE_TAG }}
          MIN_DISCOUNT_PERCENT: ${{ secrets.MIN_DISCOUNT_PERCENT }}
        run: python -m app.main --once

      - name: Salvar banco de ofertas atualizado
        if: always()
        uses: actions/cache/save@v6
        with:
          path: data/offers.sqlite3
          key: offers-db-${{ github.run_id }}